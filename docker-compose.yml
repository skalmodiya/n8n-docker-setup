services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    ports:
      - "5432:5432"   # PostgreSQL accessible at localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "5678:5678"   # local UI access at http://localhost:5678
    environment:
      # ---- Public URL (served by ngrok) ----
      - N8N_HOST=virtually-workable-fly.ngrok-free.app
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://virtually-workable-fly.ngrok-free.app/
      - N8N_EDITOR_BASE_URL=https://virtually-workable-fly.ngrok-free.app/
      # ---- Behind a reverse proxy (ngrok) ----
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=true
      # ---- Database (Postgres) ----
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # ---- Encryption key (set ONCE, never change after first run) ----
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # ---- Best-practice toggles ----
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=true
      - N8N_LOG_LEVEL=info
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${TZ:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files     # bind-mount for binary data / shared files (optional)

  qdrant:
    image: qdrant/qdrant:latest
    container_name: n8n-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Web UI at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC API
    environment:
      # Optional but recommended — protects the API. Leave blank to disable.
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
      # Tighten the dashboard to read-only if you only need to browse collections
      - QDRANT__SERVICE__READ_ONLY_API_KEY=${QDRANT_READ_ONLY_API_KEY:-}
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ngrok:
    image: ngrok/ngrok:latest
    container_name: n8n-ngrok
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--domain=virtually-workable-fly.ngrok-free.app"
      - "n8n:5678"
    ports:
      - "4040:4040"   # ngrok inspector at http://localhost:4040

volumes:
  postgres_data:
  n8n_data:
  qdrant_data:
  qdrant_snapshots:
